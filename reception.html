<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>お茶会 受付</title>
<style>
:root{ --bg:#faf7f4; --ink:#3a2e35; --sub:#8a7580; --accent:#a4456e; --accent-deep:#7c2d52; --line:#e8dfe4;
  --ok:#2e8b57; --ok-soft:#ddf0e4; --ng:#c0392b; --ng-soft:#fbe3df; --warn-soft:#faf0d2; --info:#4169aa; --info-soft:#e2eaf8; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{background:linear-gradient(135deg,#4a1f35 0%,#7c2d52 55%,#a4456e 100%);color:#fff;padding:12px 16px}
header h1{font-size:16px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.05em}
header .ev{font-size:12.5px;opacity:.9}
main{max-width:720px;margin:0 auto;padding:10px 12px 60px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:30px;text-align:center}
input[type=text],input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff}
button.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.muted{color:var(--sub);font-size:12.5px}
.err{color:var(--ng);font-size:13px;margin-top:8px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.sum{font-size:13px;color:var(--accent-deep);font-weight:700;margin:4px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.item.done{background:var(--ok-soft)} .item.part{background:var(--warn-soft)}
.nm{font-size:16px;font-weight:700} .sub{font-size:12px;color:var(--sub)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;margin:2px 3px 0 0}
.tag.ng{background:var(--ng-soft);color:var(--ng)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.info{background:var(--info-soft);color:var(--info)}
.tag.warn{background:var(--warn-soft);color:#7a5a08} .tag.perk{background:#fff4d6;color:#8a6d20;border:1px solid #e6cf8a} .tag.vis{background:#e5f3f3;color:#2f7a7a}
.ckb{margin-left:auto;min-width:92px;padding:11px 8px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent-deep);font-weight:700;font-size:14px;font-family:inherit}
.item.done .ckb:not(.abs):not(.pxy){background:var(--ok);border-color:var(--ok);color:#fff}
.item.absent{background:#ecebed} .item.absent .nm{color:#8a7580;text-decoration:line-through}
.item.proxy{background:#eef6f0}
.mem.absent{opacity:.65} .mem.absent .nm{text-decoration:line-through}
.mem.proxy{color:#3f7a52}
.tag.abs{background:#dedbe0;color:#6a5a63}
.tag.pxy{background:#dce9df;color:#3f7a52}
.ckb.sm{min-width:76px;padding:7px 6px;font-size:13px}
.ckb.abs{min-width:66px;padding:11px 6px;border-color:#b2a0ab;color:#8a7580;font-size:13px}
.ckb.abs.on{background:#8a7580;border-color:#8a7580;color:#fff}
.ckb.abs.sm{min-width:58px;padding:7px 5px}
.ckb.pxy{min-width:58px;padding:11px 6px;border-color:#9ec6ab;color:#3f7a52;font-size:13px}
.ckb.pxy.on{background:#4f9e69;border-color:#4f9e69;color:#fff}
.ckb.pxy.sm{min-width:52px;padding:7px 5px}
.rt{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.mems{background:#fbf8fa;border-bottom:1px solid var(--line);padding:4px 12px 8px 26px}
.mem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mem.done{color:var(--ok)} .mem.done .ckb:not(.abs):not(.pxy){background:var(--ok);border-color:var(--ok);color:#fff}
.mem.hit{background:#fff4d6;border-radius:6px}
a{color:var(--accent-deep)}
a.tel{display:inline-block;margin-top:2px;font-size:14px;font-weight:700;color:var(--info);text-decoration:none;border:1px solid var(--info-soft);background:var(--info-soft);border-radius:8px;padding:2px 8px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3a2e35;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;display:none;z-index:50}
.ov{position:fixed;inset:0;background:rgba(40,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.dlg{background:#fff;border-radius:14px;padding:18px;max-width:380px;width:100%}
</style>
</head>
<body>
<header><h1>お茶会 受付</h1><div class="ev" id="evInfo">CERCLE Mi-Sol-La</div></header>
<main id="app"></main>
<div id="toast"></div>
<div id="dlgHost"></div>
<script>
const API_URL = "https://arezgremacymxvqwhzrv.supabase.co/functions/v1/ocha-reception";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZXpncmVtYWN5bXh2cXdoenJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDYzNjMsImV4cCI6MjA5Nzg4MjM2M30.htZGTQQQi31Q_0jJOP-xKVXNdzyUdq8c0geitp-urqQ";
const CODE_KEY = "cercle_rc_code";
const STATE_KEY = "cercle_rc_state";     // 直近の名簿・受付状況（オフライン表示用）
const PEND_KEY = "cercle_rc_pending";    // 未送信の受付操作キュー
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}}, del(k){try{localStorage.removeItem(k);}catch(e){}}};
let CODE=null, S=null, q="", onlyYet=false, open=new Set(), pollT=null, busy=false;
let online=true, flushing=false;
// オフライン対応：未送信キュー（key→{v,t}）と、名簿・受付状況のキャッシュ（コード単位）
function loadPending(){ try{ return JSON.parse(LS.get(PEND_KEY))||{}; }catch(e){ return {}; } }
let pending = loadPending();
function savePending(){ LS.set(PEND_KEY, JSON.stringify(pending)); }
function pendCount(){ return Object.keys(pending).length; }
function cacheState(){ if(S&&CODE){ try{ LS.set(STATE_KEY, JSON.stringify({code:CODE, s:S, at:Date.now()})); }catch(e){} } }
function loadCachedState(){ try{ const o=JSON.parse(LS.get(STATE_KEY)); return (o&&o.code===CODE)?o:null; }catch(e){ return null; } }
function applyPending(s){ s.checkin=s.checkin||{}; for(const k in pending){ s.checkin[k]=pending[k]; } return s; }
// 日本語入力(IME)対策：変換中は再描画せず、確定時に1回だけ絞り込む（検索欄が作り直されて変換が壊れるのを防ぐ）
window.__ime=false;
document.addEventListener("compositionstart",()=>{ window.__ime=true; }, true);
document.addEventListener("compositionend", e=>{ window.__ime=false; const t=e.target; if(t&&t.tagName==="INPUT") setTimeout(()=>{ try{ t.dispatchEvent(new Event("input",{bubbles:true})); }catch(_){} },0); }, true);

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nameKey(s){ return String(s??"").normalize("NFKC").replace(/[\s　]/g,""); }
function kanaKey(s){ return String(s??"").normalize("NFKC").replace(/[\s　]/g,"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
const WD=["日","月","火","水","木","金","土"];
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200); }
function ask(msg){ return new Promise(res=>{ const h=document.getElementById("dlgHost");
  h.innerHTML=`<div class="ov"><div class="dlg"><div style="white-space:pre-wrap">${esc(msg)}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
  <button class="btn" style="background:#fff;color:var(--accent-deep);border:1px solid var(--accent)" id="dNo">キャンセル</button><button class="btn" id="dYes">OK</button></div></div></div>`;
  const done=v=>{ h.innerHTML=""; res(v); }; document.getElementById("dYes").onclick=()=>done(true); document.getElementById("dNo").onclick=()=>done(false); }); }
// テキスト入力ダイアログ（代理の方のお名前など）。キャンセルは null を返す
function askText(msg, initial){ return new Promise(res=>{ const h=document.getElementById("dlgHost");
  h.innerHTML=`<div class="ov"><div class="dlg"><div style="white-space:pre-wrap;margin-bottom:10px">${esc(msg)}</div>
  <input type="text" id="dTxt" value="${esc(initial||"")}" style="width:100%;font-size:16px;padding:9px 11px;border:1px solid #d8c8d2;border-radius:10px;box-sizing:border-box">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
  <button class="btn" style="background:#fff;color:var(--accent-deep);border:1px solid var(--accent)" id="dNo">キャンセル</button><button class="btn" id="dYes">OK</button></div></div></div>`;
  const inp=document.getElementById("dTxt"); setTimeout(()=>{ try{ inp.focus(); }catch(e){} },0);
  const done=v=>{ h.innerHTML=""; res(v); };
  document.getElementById("dYes").onclick=()=>done(inp.value);
  document.getElementById("dNo").onclick=()=>done(null);
  inp.onkeydown=e=>{ if(e.key==="Enter") done(inp.value); if(e.key==="Escape") done(null); };
}); }

async function api(action, payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY,"apikey":API_KEY},
    body:JSON.stringify(Object.assign({action, code:CODE},payload||{}))});
  let d=null; try{ d=await r.json(); }catch(e){} return {status:r.status, data:d};
}
function showLogin(msg){
  clearInterval(pollT);
  document.getElementById("evInfo").textContent="CERCLE Mi-Sol-La";
  document.getElementById("app").innerHTML=`<div class="box"><p style="margin-bottom:12px">運営から受け取った<b>受付コード</b>を入力してください</p>
    <input type="text" id="codeIn" placeholder="例：ABCD-EFGH-JK" autocapitalize="characters" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" style="width:100%;margin-top:10px" onclick="login()">受付を始める</button>
    ${msg?`<div class="err">${esc(msg)}</div>`:""}<p class="muted" style="margin-top:12px">QRコードから開いた場合は入力不要です。</p></div>`;
}
async function login(){ const v=document.getElementById("codeIn").value.trim(); if(!v) return; CODE=v; await load(true); }
function setEvInfo(){ if(S&&S.event) document.getElementById("evInfo").textContent=`${fmtDate(S.event.date)} ${S.event.title}${S.event.venue?"（"+S.event.venue+"）":""}`; }
function startPoll(){ clearInterval(pollT); pollT=setInterval(()=>{ if(!busy && !document.getElementById("dlgHost").innerHTML) load(false); },10000); }
async function load(first){
  let r;
  try{ r=await api("rc_state"); }
  catch(e){
    // オフライン：キャッシュがあればそれで表示（受付操作は続行できる）
    online=false;
    const c=loadCachedState();
    if(c&&c.s){ S=applyPending(c.s); setEvInfo(); render(); startPoll(); if(first) toast("オフライン表示中（前回読み込んだ名簿）"); }
    else if(first){ showLogin("最初の1回はオンライン（電波のある場所）で開いてください。名簿を読み込むと、以降はオフラインでも受付できます。"); }
    else render();
    return;
  }
  if(r.status===401){ LS.del(CODE_KEY); CODE=null; showLogin(r.data?.error||"受付コードが正しくありません"); return; }
  if(r.status!==200){
    online=false;
    const c=loadCachedState();
    if(c&&c.s){ S=applyPending(c.s); setEvInfo(); render(); startPoll(); }
    else if(first){ showLogin("エラーが発生しました（"+r.status+"）"); }
    return;
  }
  online=true; S=r.data; LS.set(CODE_KEY, CODE);
  S=applyPending(S);     // ローカルの未送信分を上書きして表示
  cacheState();
  setEvInfo(); render(); startPoll();
  flushPending();        // 未送信があれば送信を試みる
}
// 未送信キューをまとめて送信（接続復帰時・受付時・ポーリング時に呼ばれる）
async function flushPending(){
  if(flushing) return; const keys=Object.keys(pending); if(!keys.length) return;
  flushing=true;
  try{
    // (v, st, 代理名) の組み合わせごとにまとめて送信
    const grp={};
    for(const k of keys){ const p=pending[k]; const g=(p.v?"1":"0")+"|"+(p.st||"")+"|"+(p.sub||""); (grp[g]=grp[g]||[]).push(k); }
    for(const g of Object.keys(grp)){
      const ks=grp[g]; const parts=g.split("|"); const v=parts[0]==="1", st=parts[1], sub=parts.slice(2).join("|");
      let r; try{ r=await api("rc_checkin",{keys:ks, v, st, sub}); }
      catch(e){ online=false; return; }           // まだオフライン→次回に再送
      if(r.status===401){ showLogin(r.data?.error); return; }
      if(r.status===200&&r.data?.ok){ online=true; ks.forEach(k=>{ delete pending[k]; }); Object.assign(S.checkin, r.data.updated); }
      else { online=true; return; }               // サーバーエラー→キューに残して次回
    }
  } finally {
    flushing=false; savePending(); cacheState();
    if(!document.getElementById("dlgHost").innerHTML) render();
  }
}
async function confirmSafe(){ if(await ask("この端末から受付コードを消して終了しますか？")){ LS.del(CODE_KEY); CODE=null; S=null; showLogin(); } }

function groups(){
  const ck=S.checkin||{};
  return S.groups.map(g=>{ const mem=g.members.map((m,i)=>{ const c=ck[g.id+":"+i]||{}; return {...m,i,key:g.id+":"+i,done:!!c.v,absent:c.st==="absent",sub:(c.v&&c.sub)?c.sub:""}; });
    return {...g, mem, n:mem.length, done:mem.filter(x=>x.done).length, absent:mem.filter(x=>x.absent).length, proxy:mem.filter(x=>x.sub).length}; })
   .sort((a,b)=>kanaKey(a.kana||a.name).localeCompare(kanaKey(b.kana||b.name),"ja"));
}
// グループ全員の欠席を切り替え（当日キャンセル・急病など）
async function absGroup(id){
  const g=groups().find(x=>x.id===id); if(!g) return;
  const allAbs=g.absent===g.n;
  if(allAbs) return ck(g.mem.map(m=>m.key), false, true, "");                          // 欠席を取消→未受付へ
  if(!await ask(`${g.name}様${g.n>1?`のグループ（${g.n}名）`:""}を「欠席」にしますか？`)) return;
  return ck(g.mem.map(m=>m.key), false, true, "absent");
}
// 同じブロック・列の連番はまとめて「C-1-1〜10」
function telHtml(p){ const d=String(p||"").replace(/[^\d+]/g,""); if(!d) return ""; const f=d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d;   // 固定電話は市外局番の桁がまちまちなのでそのまま
  return `<a class="tel" href="tel:${d}" onclick="event.stopPropagation()">📞 ${f}</a>`; }
function seatsText(mem){
  const ps=mem.map(m=>m.seat).filter(Boolean).map(id=>{ const m=String(id).match(/^(.+)-(\d+)-(\d+)$/); return m?{k:m[1]+"-"+m[2],n:+m[3]}:{k:id,n:null}; });
  const g=new Map(); for(const p of ps){ if(!g.has(p.k)) g.set(p.k,[]); g.get(p.k).push(p.n); }
  return [...g.entries()].map(([k,ns])=>{ if(ns[0]==null) return k; ns.sort((a,b)=>a-b); const parts=[]; let s=ns[0],e=ns[0];
    for(const x of ns.slice(1)){ if(x===e+1) e=x; else { parts.push(s===e?`${s}`:`${s}〜${e}`); s=e=x; } } parts.push(s===e?`${s}`:`${s}〜${e}`);
    return `${k}-${parts.join(",")}`; }).join("／");
}
function render(){
  const all=groups(); const persons=all.reduce((s,g)=>s+g.n,0), doneP=all.reduce((s,g)=>s+g.done,0), absentP=all.reduce((s,g)=>s+g.absent,0), proxyP=all.reduce((s,g)=>s+g.proxy,0), doneG=all.filter(g=>g.done+g.absent===g.n).length;
  const qk=nameKey(q), kk=kanaKey(q); const hit=m=>q && (nameKey(m.name).includes(qk) || (kk && kanaKey(m.kana).includes(kk)));
  let list=all; if(q) list=list.filter(g=>g.mem.some(hit)||(kk&&kanaKey(g.kana).includes(kk))); if(onlyYet) list=list.filter(g=>g.done+g.absent<g.n);
  const focus=document.activeElement?.id==="q"; const pos=document.getElementById("q")?.selectionStart;
  document.getElementById("app").innerHTML=`
  <div class="sticky">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12.5px">
      ${(()=>{ const pn=pendCount();
        if(!online) return `<span style="color:var(--ng);font-weight:700">🔴 オフライン${pn?` ・ 未送信 ${pn}件`:"（受付は続けられます）"}</span>`;
        if(pn) return `<span style="color:#9a6b00;font-weight:700">🟡 未送信 ${pn}件 <a href="#" onclick="flushPending();return false">今すぐ送信</a></span>`;
        return `<span style="color:var(--ok);font-weight:700">🟢 オンライン</span>`; })()}
      <span class="sum">来場 ${doneP}/${persons}名${proxyP?`<span style="color:#3f7a52">（代理 ${proxyP}）</span>`:""}${absentP?` ・ <span style="color:#8a7580">欠席 ${absentP}名</span>`:""} ・ 完了 ${doneG}/${all.length}組</span>
    </div>
    <input type="search" id="q" placeholder="お名前・ふりがなで検索（同伴者でもOK）" value="${esc(q)}" oninput="if(window.__ime)return;q=this.value;render()">
    <div style="margin-top:4px">
      <label class="muted"><input type="checkbox" ${onlyYet?"checked":""} onchange="onlyYet=this.checked;render()"> 未受付だけ</label></div></div>
  <div class="card">${list.slice(0,150).map(g=>{
    const allAbs=g.n>0&&g.absent===g.n; const m0=g.mem[0], self0=m0.done&&!m0.sub;
    const full=g.done===g.n, part=g.done>0&&g.done<g.n; const compHit=q&&g.mem.some(m=>m.i>0&&hit(m)); const op=g.n>1&&(open.has(g.id)||compHit);
    const btns = g.n===1
      ? `<button class="ckb" onclick="ck(['${m0.key}'],${!self0})">${self0?"✓ 受付済":"受付"}</button>`
        +`<button class="ckb pxy${m0.sub?" on":""}" onclick="${m0.sub?`ck(['${m0.key}'],false,true)`:`setProxy('${m0.key}')`}">代理</button>`
        +`<button class="ckb abs${m0.absent?" on":""}" onclick="ck(['${m0.key}'],false,true,'${m0.absent?"":"absent"}')">${m0.absent?"取消":"欠席"}</button>`
      : `<button class="ckb" onclick="ckGroup('${g.id}')">${full?"✓ 全員済":part?`残り${g.n-g.done}名を受付`:`全員受付（${g.n}名）`}</button>`
        +`<button class="ckb abs${allAbs?" on":""}" onclick="absGroup('${g.id}')">${allAbs?"欠席 取消":"欠席"}</button>`;
    return `<div class="item ${allAbs?"absent":(g.n===1&&m0.sub)?"proxy":full?"done":part?"part":""}"><div style="flex:1;min-width:0">
      <div class="nm">${esc(g.name)}<span style="font-weight:400;font-size:13px">様</span> ${allAbs?`<span class="tag abs">欠席</span>`:(g.n===1&&m0.sub)?`<span class="tag pxy">代理：${esc(m0.sub)}様</span>`:g.n>1?`<span class="tag ${full?"ok":part?"warn":"info"}">${g.done}/${g.n}名${g.absent?`・欠${g.absent}`:""}${g.proxy?`・代${g.proxy}`:""}</span>`:""}</div>
      <div class="sub">${esc(g.kana)}${seatsText(g.mem)?` ／ 💺${esc(seatsText(g.mem))}`:""}</div>
      ${g.phone?`<div>${telHtml(g.phone)}</div>`:""}
      <div>${g.visitor?`<span class="tag vis">ご見学 ${esc(g.affiliation)}</span>`:""}${g.unpaid?`<span class="tag ng">未入金</span>`:""}${g.perks.map(p=>`<span class="tag perk">★${p}名以上特典</span>`).join("")}${g.mem.filter(m=>m.prevWin).map(m=>`<span class="tag warn">🎁前回当選：${esc(m.name)}様</span>`).join("")}</div>
      ${g.n>1?`<a href="#" class="muted" onclick="tog('${g.id}');return false">${op?"▲ 閉じる":"▼ 1人ずつ 受付・欠席・代理（別々にご来場の場合）"}</a>`:""}</div>
      <div class="rt">${btns}</div></div>
      ${op?`<div class="mems">${g.mem.map(m=>`<div class="mem ${m.sub?"proxy":m.done?"done":""} ${m.absent?"absent":""} ${hit(m)?"hit":""}"><span style="flex:1">${m.i===0?"👑 ":""}${esc(m.name)}様 <span class="muted">${esc(m.kana)}${m.seat?" 💺"+esc(m.seat):""}</span>${m.sub?` <span class="tag pxy">代理：${esc(m.sub)}様</span>`:m.absent?' <span class="tag abs">欠席</span>':""}</span>
        <button class="ckb sm" onclick="ck(['${m.key}'],${!(m.done&&!m.sub)})">${(m.done&&!m.sub)?"✓ 受付済":"受付"}</button>
        <button class="ckb pxy sm${m.sub?" on":""}" onclick="${m.sub?`ck(['${m.key}'],false,true)`:`setProxy('${m.key}')`}">代理</button>
        <button class="ckb abs sm${m.absent?" on":""}" onclick="ck(['${m.key}'],false,true,'${m.absent?"":"absent"}')">${m.absent?"取消":"欠席"}</button></div>`).join("")}</div>`:""}`;
  }).join("")||`<p class="muted" style="padding:12px">該当なし</p>`}</div>
  ${list.length>150?`<p class="muted">先頭150組を表示中。検索で絞り込んでください。</p>`:""}
  <p class="muted" style="margin-top:14px;text-align:center">受付状況は10秒ごとに自動で更新されます ・ <a href="#" onclick="confirmSafe();return false">終了する</a></p>`;
  if(focus){ const i=document.getElementById("q"); i.focus(); try{ i.setSelectionRange(pos,pos); }catch(e){} }
}
function tog(id){ if(open.has(id)) open.delete(id); else open.add(id); render(); }
// 代理で来られた方を受付（本人は欠席だが席は埋まる＝来場扱い）。お名前を記録
async function setProxy(key){
  const name=await askText("代理で来られた方のお名前を入力してください。","");
  if(name===null) return;                         // キャンセル
  const nm=name.replace(/[\s　]+/g," ").trim();
  if(!nm){ toast("お名前が未入力です"); return; }
  return ck([key], true, true, "", nm);           // 受付(v:true)＋代理名。欠席ステータスは付けない
}
// v=受付済み(true/false) ／ st="absent"で欠席 ／ sub=代理の方のお名前。受付＝v:true、欠席＝v:false,st:"absent"、代理＝v:true,sub:"名前"、未受付へ戻す＝v:false
async function ck(keys,v,noAsk,st,sub){
  st=st||""; sub=sub||"";
  if(!v && !st && !noAsk && !await ask("受付を取り消しますか？")) return;
  busy=true;
  const t=Date.now();
  keys.forEach(k=>{ const val={v,t}; if(st) val.st=st; if(v&&sub) val.sub=sub; S.checkin[k]=val;
    const p={v,t}; if(st) p.st=st; if(v&&sub) p.sub=sub; pending[k]=p; });
  savePending(); cacheState(); render();
  try{
    const r=await api("rc_checkin",{keys,v,st,sub});
    if(r.status===200&&r.data?.ok){
      keys.forEach(k=>{ if(pending[k]&&pending[k].t===t) delete pending[k]; });   // この送信ぶんをキューから外す（その後の変更は残す）
      Object.assign(S.checkin, r.data.updated);
      online=true; savePending(); cacheState(); render(); toast(sub?"代理で受付しました":st==="absent"?"欠席にしました":v?"受付しました":"取り消しました");
    } else if(r.status===401){ showLogin(r.data?.error); }
    else { online=true; render(); toast(r.data?.error||"保存に失敗しました（接続時に自動で再送します）"); }   // キューに残す
  }catch(e){
    online=false; render(); toast("オフライン：未送信として保存しました（接続すると自動送信）");                // キューに残す
  }
  finally{ busy=false; }
}
async function ckGroup(id){
  const g=groups().find(x=>x.id===id); const full=g.done===g.n;
  if(full){ if(!await ask(`${g.name}様のグループ（${g.n}名）の受付をすべて取り消しますか？`)) return; return ck(g.mem.map(m=>m.key),false,true); }
  const ks=g.mem.filter(m=>!m.done&&!m.absent).map(m=>m.key);   // 欠席の方は受付しない
  if(!ks.length){ toast("受付できる方がいません（欠席を取り消すと受付できます）"); return; }
  return ck(ks,true);
}
// 接続状態の変化を検知：復帰したら名簿更新＋未送信を自動送信
online = (typeof navigator!=="undefined" && "onLine" in navigator) ? navigator.onLine : true;
window.addEventListener("online", ()=>{ online=true; if(S){ if(!document.getElementById("dlgHost").innerHTML) render(); load(false); } });
window.addEventListener("offline", ()=>{ online=false; if(S && !document.getElementById("dlgHost").innerHTML) render(); });
// 起動：QRコードのURL（#c=コード）→ 端末に保存済みのコード → 入力画面
(()=>{ const m=location.hash.match(/[#&]c=([^&]+)/);
  if(m){ CODE=decodeURIComponent(m[1]); history.replaceState(null,"",location.pathname); }
  else CODE=LS.get(CODE_KEY);
  if(CODE) load(true); else showLogin();
})();
</script>
