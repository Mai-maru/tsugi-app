<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CERCLE Mi-Sol-La 運営アプリ</title>
<style>
:root{ --ink:#3a2e35; --sub:#8a7580; --accent:#a4456e; --accent-deep:#7c2d52; --line:#e8dfe4; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:#faf7f4;color:var(--ink);min-height:100vh}
header{background:linear-gradient(135deg,#4a1f35 0%,#7c2d52 55%,#a4456e 100%);color:#fff;padding:34px 20px 30px;text-align:center}
header h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:24px;letter-spacing:.08em}
header p{font-size:12.5px;opacity:.85;letter-spacing:.2em;margin-top:6px}
main{max-width:720px;margin:-16px auto 40px;padding:0 16px;display:grid;gap:14px}
a.card{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 20px;text-decoration:none;color:inherit;box-shadow:0 4px 16px rgba(90,50,70,.10);transition:transform .12s}
a.card:hover{transform:translateY(-2px)}
a.card .ic{font-size:34px;width:56px;height:56px;border-radius:14px;background:#f3dce6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
a.card h2{font-size:17px;color:var(--accent-deep)}
a.card p{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.6}
a.card.soon{opacity:.55;pointer-events:none}
.badge{font-size:11px;background:#eee;color:#777;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding-bottom:30px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#4a1f35,#a4456e);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
#login .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:360px;width:100%;text-align:center}
#login h1{font-family:"Yu Mincho",serif;color:var(--accent-deep);font-size:20px;margin-bottom:4px}
#login input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;font-family:inherit}
#login button,.out{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.out{background:transparent;border:1px solid rgba(255,255,255,.6);font-size:12px;padding:4px 12px;margin-top:10px}
#loginStatus{color:#c0392b;font-size:12.5px;margin-top:8px;min-height:1em}
.muted{color:var(--sub);font-size:12.5px}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>CERCLE Mi-Sol-La</h1>
    <p class="muted" style="margin-bottom:14px">運営アプリ（チケット取次と同じパスワード）</p>
    <input type="password" id="pw" placeholder="パスワード" onkeydown="if(event.key==='Enter')doLogin()">
    <label class="muted" style="display:block;margin:8px 0"><input type="checkbox" id="remember" checked> ログイン状態を保持</label>
    <button style="width:100%" onclick="doLogin()">ログイン</button>
    <div id="loginStatus"></div>
  </div>
</div>
<header><h1>CERCLE Mi-Sol-La</h1><p>運営アプリ</p><button class="out" onclick="logout()">ログアウト</button></header>
<main>
  <a class="card" href="https://mai-maru.github.io/tsugi-app/">
    <div class="ic">🎫</div>
    <div><h2>チケット取次システム</h2><p>名簿・申込・振り分け・配席・ご案内文・返金</p></div>
  </a>
  <a class="card" href="./ocha.html">
    <div class="ic">☕</div>
    <div><h2>お茶会管理</h2><p>申込取込・特典・配席・リマインド文・当日受付・抽選会</p></div>
  </a>
  <a class="card soon" href="#">
    <div class="ic">🛍</div>
    <div><h2>物販管理<span class="badge">準備中</span></h2><p>グッズの注文・在庫・お渡し管理</p></div>
  </a>
</main>
<footer>名簿・申込データは各システムで共有しています（パスワードも共通です）</footer>
<script>
const API_URL = "https://arezgremacymxvqwhzrv.supabase.co/functions/v1/tsugi-api";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZXpncmVtYWN5bXh2cXdoenJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDYzNjMsImV4cCI6MjA5Nzg4MjM2M30.htZGTQQQi31Q_0jJOP-xKVXNdzyUdq8c0geitp-urqQ";
const PW_KEY = "isolla_tsugi_pw";        // 取次システム・お茶会管理と共通（保持する場合）
const PW_SESSION = "cercle_ops_pw";       // 保持しない場合（このタブを閉じるまで）
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}}, del(k){try{localStorage.removeItem(k);}catch(e){}}};
const SS={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}, del(k){try{sessionStorage.removeItem(k);}catch(e){}}};
async function check(pw){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY,"apikey":API_KEY},body:JSON.stringify({action:"login",password:pw})});
  let d=null; try{ d=await r.json(); }catch(e){} return r.status===200&&d&&d.ok;
}
async function doLogin(){
  const pw=document.getElementById("pw").value; const st=document.getElementById("loginStatus");
  if(!pw){ st.textContent="パスワードを入力してください"; return; }
  st.style.color="#8a7580"; st.textContent="確認中…";
  let ok=false; try{ ok=await check(pw); }catch(e){ st.style.color=""; st.textContent="接続できませんでした"; return; }
  if(!ok){ st.style.color=""; st.textContent="パスワードが違います"; return; }
  if(document.getElementById("remember").checked) LS.set(PW_KEY,pw); else { LS.del(PW_KEY); }
  SS.set(PW_SESSION,pw);
  document.getElementById("login").style.display="none";
}
function logout(){ LS.del(PW_KEY); SS.del(PW_SESSION); location.reload(); }
(async()=>{
  const pw=SS.get(PW_SESSION)||LS.get(PW_KEY);
  if(!pw) return;
  try{ if(await check(pw)){ SS.set(PW_SESSION,pw); document.getElementById("login").style.display="none"; return; } }catch(e){}
  LS.del(PW_KEY); SS.del(PW_SESSION);
})();
</script>
</body>
</html>
